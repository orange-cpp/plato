name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure and build Release
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $visualStudio) {
            throw "Visual Studio with the MSVC x64 toolchain was not found."
          }

          $devShell = Join-Path $visualStudio "Common7\Tools\Launch-VsDevShell.ps1"
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake --preset windows-release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          cmake --build cmake-build/build/windows-release --parallel
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            "out/Release/plato.sys"
            "out/Release/plato_client.lib"
            "out/Release/plato_client_example.exe"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $assets = @(
            "out/Release/plato.sys"
            "out/Release/plato_client.lib"
            "out/Release/plato_client_example.exe"
          )

          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG_NAME @assets `
              --verify-tag `
              --generate-notes `
              --title $env:TAG_NAME `
              --repo $env:GITHUB_REPOSITORY
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
